<html>
    <head>
        <title>Objects in Javascript</title>
    </head>
    <body>
        <h1>Javascript Objects and its properties</h1>
        <p>There are two different ways to access an object</p>
        <p>You can use .property or ["property"]</p>
        <p id="result"> </p>
        <script>
            var person={ firstname : "I" , age:12} ;

            document.getElementById("result").innerHTML=person.firstname + " am Praneet I'm " + person.age + " years old"
        </script>
    </body>
</html>
