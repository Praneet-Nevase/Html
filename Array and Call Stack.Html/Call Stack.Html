<html>
    <head>
        <Title>Call Stack</Title>
    </head>
    <body>
        <H1>Call Stack in Javascript</H1>
        <p>Do a calculation and display the result</p>
        <p id="demo"></p>
        <script>
         function   add(a,b)
         {
            return a+b
         }
         function    average(a,b)
         {
            return   add(a,b)/2
         }
         let result=average(30,2412542)
         document.getElementById("demo").innerHTML=result
        </script>
    </body>
</html>
