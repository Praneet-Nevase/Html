<!DOCTYPE html>

<html>

<head>

    <title>Bootstrap Utilities</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body style="text-align:center">
    <div class="jumbotron jumbotron fluid">
     <div class="container">
        <h1 style="color: red">Codingal</h1>
        <p>
            Codingal will help to fall in love with coding
        </p>
     </div>
    </div>
    <div class="container mt-1"><h2>Buttons</h2>
    <button type="Button" class="btn btn-primary">Submit<span class="badge badge-secondary">New</span></button>

    <button type="Button" class="btn btn-secondary">Secondary</button>

    <button type="Button" class="btn btn-success">
        Success</button>

        <button type="Button" class="btn btn-primary">Notifications<span class="badge badge-secondary">2</span></button>

        <button type="Button" class="btn btn-danger">Messages<span class="badge badge-secondary">3</span></button>

    </div>

    <div class="container">
        <h2>Badges</h2>
        <span class="badge badge-secondary">New</span>
    </div>

    <div class="container">
        <h2>Progress Bar</h2>
        <div class="progress">
            <div class="progress-bar" style="width:70%">70%</div>
        </div>
    </div>

</body>

</html>
