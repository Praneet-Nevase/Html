<Html>
    <Head>
        <Title>Methods</Title>
    </Head>
    <body>
        <H2>Javascript String Methods</H2>
        <p>Basic Methods</p>
        <script>
            var str = "WhOpPeR"
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith("W"));
        </script>
    </body>
</Html>
