<Html>
    <Head>
        <Title>
            Loops
        </Title>
    </Head>
    <Body>
        <H2>Loops In Javascript</H2>
        <p id="demo"></p>
        <script>
            var Fruits=["Banana","Mango","Apple","Guava"];

            var text=""
            var i;

            for(i=0 ; i<Fruits.length ; i++)
            {
                text += Fruits[i] + "<br>"
            }
            document.getElementById("demo").innerHTML=text
        </script>
    </Body>
</Html
