<HTML>
    <HEAD>
        <TITLE>
            TYPOGRAPHY
        </TITLE>
     <style>
         .text1{
            color: blue;
            font-size: 30px;
            font-family:'Courier New', Courier, monospace
         }
         .text2{
            color:rgb(0, 38, 255);
            font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            Font-size: 50px;
         }
         div{
            width:300px;
            height:100px;
            background-color: blanchedalmond;
            border:2px solid black;
         }
         #mydiv{
            transform: rotateY(180deg);
         }
         #Shadow{
            text-shadow: 2px 2px 2px red;
         }
         h1{
            text-decoration: underline;
            text-transform: capitalize;
        }
    </style>
    </HEAD>
    <BODY>
        <H1>TEXT STYLING PROPERTIES</H1>
        <P class="text1">Welcome To Codingal</P>
        <p class="text2">Welcome To Codingal</p>
        <p>Rotate Method</p>
        <div>Codingal</div>
        <div id="mydiv">
            Codingal
        </div>
        <p id="shadow">
            Welcome To Codingal 
        </p>
        <h1>
            Codingal
        </h1>
    </BODY>
</HTML>
