<!DOCTYPE html>

<html>

<head>

    <title>My Playlist Sorter</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background: lavender;
        }

        h1,
        h3 {
            color: darkviolet;
        }

        .box {
            background: white;
            color: darkviolet;
        }
    </style>

</head>

<body>
    <div class="container py-4">
        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">
            Sort and label your music playlist using Javascript array methods
        </p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAtoZ()">Sort A to Z</button>
                <button class="btn btn-primary mr-2" onclick="sortZtoA()">Sort Z to A</button>
                <div id="nameresult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div> 

            <div class="card mb-4">
                <div class="card-body">
                <h3 class="card-title">Play Count</h3>
                <button class="btn btn-primary mr-4" onclick="sortleast()">Least First Played</button>
                <button class="btn btn-primary mr-4" onclick="sortmost()">Most First Played</button>
                <div id="playcountresult" class="box p-3 mt-3 rounded"></div>
            </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Label Every Play Count</h3>
                    <button class="btn btn-primary mr-4" onclick="label()">Label play count</button>
                    <div id="labelresult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        var songs=[" Zoom"," Bounce"," Oiia"," Rush E"," Big Dawgs"]
        var plays=["320","85","90","295","598"]
        document.getElementById("nameresult").innerHTML="Songs: " + songs
        document.getElementById("playcountresult").innerHTML = "Play counts: " + plays

        function sortAtoZ()
        {
            songs.sort()
            document.getElementById("nameresult").innerHTML = "Songs: " + songs
        }

        function sortZtoA()
        {
            songs.sort()
            songs.reverse()
            document.getElementById("nameresult").innerHTML = "Songs: " + songs
        }

        function sortleast()
        {
            plays.sort(function (a,b){return a-b})
            document.getElementById("playcountresult").innerHTML = "Play counts: " + plays

        }
        function sortmost() 
        {
                plays.sort(function (a, b) { return b - a })
                document.getElementById("playcountresult").innerHTML = "Play counts: " + plays

        }
        function label()
        {
            var l=plays.map(function(c){return c + " plays"})
            document.getElementById("labelresult").innerHTML = "Play counts: " + l

        }
    </script>
    
</body>
