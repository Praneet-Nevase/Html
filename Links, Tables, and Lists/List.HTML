<HTML>
    <HEAD>
        <TITLE>LISTS</TITLE>
    </HEAD>
    <Body>
        <h2>An ordered html list
        </h2>
        <ol>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
            <li>Fourth Item</li>
        </ol>
        <H2>An unordered HTML List</H2>
        <ul>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ul>
        <H2>A descriptive HTML List</H2>
        <dl>
            <dt>TEA</dt>
            <dd>- Hot Drink</dd>
            <dt>Juice</dt>
            <dd>- Ice Drink</dd>
        </dl>
    </Body>
</HTML>
