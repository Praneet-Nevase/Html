<Html>
    <body>
        <p>Function can access variable defined inside the function</p>
        <button onclick="myfunction()">Click me!</button>
        <p id="demo1"></p>
        <p id="demo2"></p>

        <script>
            var a=10
            function myfunction()
            {
                var b=9
                document.getElementById("demo1").innerHTML=a * b;
            }
        </script>
    </body>
</Html>
